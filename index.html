<style>

.hide{display:none!important}
button{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--l);padding:6px 12px;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;transition:.2s;letter-spacing:.02em}

#stat{color:var(--m);font-size:12px}

.sep{width:1px;height:22px;background:var(--l);margin:0 6px}

#pop label,#lp label{display:flex;justify-content:space-between;align-items:center;gap:8px}
#cm{position:fixed;z-index:50;background:var(--p2);border:1px solid var(--l);border-radius:12px;padding:4px}#cm div{padding:7px 14px;cursor:pointer;border-radius:8px}#cm div:hover{background:var(--l)}

button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:has(svg){display:inline-flex;align-items:center;justify-content:center;gap:6px}

#pres{display:flex;padding:0 10px 0 16px;align-items:center}.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;border:2px solid var(--p);margin-left:-8px;box-shadow:0 2px 8px #0006;cursor:default}.av.me{outline:2px solid var(--b)}

/* themed scrollbars */
*{scrollbar-width:thin;scrollbar-color:#5b46c9 #0d0b18}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#0d0b18;border-radius:99px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--a),var(--b));border-radius:99px;border:2px solid #0d0b18;min-height:36px;min-width:36px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--c),var(--a))}
::-webkit-scrollbar-thumb:active{background:linear-gradient(180deg,var(--b),var(--c))}

.sn.tx.sel .sh{opacity:.9}
#nt{align-items:center;flex-wrap:wrap;right:14px;background:rgba(19,17,31,.88);padding:6px 10px;border:1px solid var(--l);border-radius:14px;backdrop-filter:blur(10px)}#nt label{display:flex;align-items:center;gap:6px;color:var(--m);font-size:12px}
#nprop{position:absolute;z-index:6;right:14px;top:78px;width:236px;display:flex;flex-direction:column;gap:10px;padding:14px}

.stars{display:flex;gap:6px;font-size:32px;line-height:1}.stars span{cursor:pointer;color:#3a3560;transition:color .15s,transform .15s;user-select:none}.stars span.f{color:#facc15;text-shadow:0 0 12px rgba(250,204,21,.55)}.stars span:hover{transform:scale(1.18)}
.rtl{font-size:12px;color:var(--m)}.rtl b{color:var(--t)}.lnk{padding:0 6px;border:0;background:none;color:var(--c);text-decoration:underline;font-size:12px}.lnk::after{display:none}
/* player fullscreen: the film fills the whole screen */
#plc{max-width:100%;max-height:100%;aspect-ratio:16/9;background:#fff}
#pl.fs>#plw{position:absolute;inset:0}
#pl.fs #plc{width:100vw;height:100vh;max-width:none;max-height:none;aspect-ratio:auto;object-fit:contain;background:transparent}
#pl.fs #plb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8));transition:opacity .25s;z-index:2}
#pl.fs.idle #plb{opacity:0;pointer-events:none}#pl.fs.idle{cursor:none}
#pl.fs #rt{display:none!important}
/* notes: only the editable text areas can be selected */
#sN{user-select:none;-webkit-user-select:none}
#sN .sb,#sN input{user-select:text;-webkit-user-select:text}
#sN .sh,#sN .sh *{user-select:none;-webkit-user-select:none}
/* toolbar dropdowns */
.dd{position:relative;display:inline-flex;align-items:center}

.ddm{position:fixed;z-index:60;background:var(--p2);border:1px solid var(--l);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:210px;box-shadow:0 16px 48px #000b}
#ptools .ddm button.it{width:100%;height:auto;justify-content:flex-start;gap:10px;padding:6px 10px;border:0;background:transparent;text-align:left;border-radius:8px}

#ptools .ddm button.it svg{width:20px;height:20px}
#cmenu{min-width:200px;gap:8px;padding:10px}
.sgrid{display:grid;grid-template-columns:repeat(6,26px);gap:6px}
#ptools .sgrid button.sw{width:26px;height:26px;padding:0;border-radius:7px}
.cswi{width:20px;height:20px;border-radius:6px;border:1px solid #fff5;display:block}
#csw{display:inline-flex;align-items:center;justify-content:center}#ov{touch-action:none}
.nbt{min-width:64px;padding:4px 8px;font-size:12px}.nmenu{min-width:130px;gap:6px}.nin{width:100%}.nl{display:flex;flex-direction:column;overflow:auto;max-height:220px}.nl button{border:0;background:transparent;text-align:left;padding:4px 10px;border-radius:6px}.nl button:hover,.nl button.on{background:var(--l)}
#rm{position:fixed;inset:0;z-index:90;background:#000a;display:flex;align-items:center;justify-content:center}.rbox{padding:18px!important}.rgrid{display:grid;grid-template-columns:repeat(10,34px);gap:6px;margin:14px 0}.rgrid .sw{width:34px;height:34px;border-radius:8px}.sw.e{border:1px dashed var(--l);background:none}

</style></head>
