<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Twilight Studios</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0912;--p:#13111f;--p2:#1b1830;--l:#2c2850;--t:#e9e6ff;--m:#8d88b8;--a:#8b5cf6;--b:#22d3ee;--c:#f472b6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:14px 'Space Grotesk',system-ui,sans-serif;height:100vh;overflow:hidden}
#glow{position:fixed;inset:0;z-index:-1;background:radial-gradient(520px circle at var(--mx,50%) var(--my,50%),rgba(139,92,246,.25),transparent 60%)}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.33;z-index:-2;animation:fl 16s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(140px,-90px) scale(1.35)}}
.hide{display:none!important}
button{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--l);padding:6px 12px;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;transition:.2s;letter-spacing:.02em}
button::after{content:"";position:absolute;inset:0;background:radial-gradient(90px circle at var(--x,50%) var(--y,50%),rgba(139,92,246,.45),transparent);opacity:0;transition:.2s}
button:hover::after{opacity:1}button:hover{border-color:var(--a)}
button.on{border-color:var(--b);box-shadow:0 0 14px rgba(34,211,238,.35)}
.pr{background:linear-gradient(120deg,var(--a),var(--c));border:0;font-weight:500}
input,select{font:inherit;color:var(--t);background:#0d0b18;border:1px solid var(--l);border-radius:10px;padding:7px 10px;outline:0}
input:focus{border-color:var(--a)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.glass{background:rgba(27,24,48,.6);backdrop-filter:blur(18px);border:1px solid var(--l);border-radius:20px;padding:30px}
.logo{font-weight:300;letter-spacing:.35em;text-transform:uppercase;background:linear-gradient(90deg,var(--b),var(--a),var(--c),var(--b));background-size:300%;-webkit-background-clip:text;color:transparent;animation:sh 8s linear infinite}
@keyframes sh{to{background-position:300%}}
#a{align-items:center;justify-content:center;gap:22px}
#a .glass{width:340px;display:flex;flex-direction:column;gap:12px}
#a h1{font-size:34px;text-align:center}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#err{color:var(--c);min-height:18px;font-size:12px}
.bh{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--l)}.bh h1{font-size:18px;flex:0}.bh nav{display:flex;gap:6px;flex:1;margin-left:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:24px;overflow:auto}
.card{background:rgba(27,24,48,.6);border:1px solid var(--l);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:.25s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 10px 40px rgba(139,92,246,.25)}
.card p,.card small{color:var(--m)}.card.new{align-items:center;justify-content:center;min-height:150px;border-style:dashed;cursor:pointer;font-size:30px}
#w{align-items:center;justify-content:center}#wc{width:460px;display:flex;flex-direction:column;gap:12px}
.chip{background:var(--p2);border:1px solid var(--l);padding:3px 10px;border-radius:99px;margin:2px;display:inline-block}
#hd,#ptools{flex:none}
#hd{display:flex;gap:10px;align-items:center;padding:8px 14px;background:rgba(19,17,31,.9);border-bottom:1px solid var(--l)}#hd nav{display:flex;gap:4px;margin:0 auto}
#stat{color:var(--m);font-size:12px}
#ptools{display:flex;gap:4px;align-items:center;padding:5px 14px;background:var(--p);border-bottom:1px solid var(--l);flex-wrap:wrap}
#ptools button{padding:4px 9px}.sw{width:18px;height:18px;border-radius:5px;border:1px solid #fff3;padding:0;display:inline-block}
.sep{width:1px;height:22px;background:var(--l);margin:0 6px}
main{position:relative;overflow:hidden;min-height:0;flex:1}main>div{position:absolute;inset:0}
#st{overflow:hidden;background:#100e1c}#vw{position:absolute;left:0;top:0;transform-origin:0 0;width:960px;height:540px;box-shadow:0 0 60px #8b5cf655}
#view,#ov{position:absolute;left:0;top:0;width:960px;height:540px}#ov{cursor:crosshair}
#tl{flex:none;height:196px;background:var(--p);border-top:1px solid var(--l);display:flex;flex-direction:column}
#tb{display:flex;gap:6px;align-items:center;padding:6px 12px}#tw{flex:1;overflow:auto;position:relative}#ti{position:relative;width:max-content}#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--c);box-shadow:0 0 10px var(--c);pointer-events:none}
#tm{font-variant-numeric:tabular-nums;color:var(--b);min-width:90px}
#pop,#lp{position:absolute;top:96px;right:14px;z-index:20;width:290px;display:flex;flex-direction:column;gap:9px;max-height:75vh;overflow:auto}
#pop label,#lp label{display:flex;justify-content:space-between;align-items:center;gap:8px}
#cm{position:fixed;z-index:50;background:var(--p2);border:1px solid var(--l);border-radius:12px;padding:4px}#cm div{padding:7px 14px;cursor:pointer;border-radius:8px}#cm div:hover{background:var(--l)}
#sM{display:flex;flex-direction:column}#mt{display:flex;gap:8px;padding:8px 14px;align-items:center;flex-wrap:wrap;background:var(--p)}
#ps{flex:1;overflow:auto;position:relative}#pi{display:flex;width:max-content}#keys{position:sticky;left:0;z-index:3}#gw{position:relative}#prph{position:absolute;top:0;bottom:0;width:2px;background:var(--c);box-shadow:0 0 10px var(--c);pointer-events:none}
#nb{overflow:hidden;background-color:#0e0c1a;background-image:linear-gradient(var(--gl,#2c285099) 1px,transparent 1px),linear-gradient(90deg,var(--gl,#2c285099) 1px,transparent 1px);background-size:40px 40px;cursor:grab}#mbin>*{flex:none}#mrow{flex:1;display:flex;min-height:0}#mbin{width:250px;flex:none;overflow:auto;border-right:1px solid var(--l);background:var(--p);padding:10px;display:flex;flex-direction:column;gap:8px}
#nw{position:absolute;left:0;top:0;transform-origin:0 0}#nsvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}#nsvg *{pointer-events:stroke}
.sn{position:absolute;min-width:150px;min-height:110px;width:190px;border-radius:6px;color:#1b1830;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;resize:both;overflow:hidden}.sn.tx{width:max-content;max-width:700px;background:transparent;box-shadow:none;border:0;resize:none;min-width:0;min-height:0;width:auto;flex-direction:row;overflow:visible}.sn.tx .sh{background:none;padding:2px;opacity:0;font-size:12px;color:var(--m);position:absolute;left:-18px;top:2px}.sn.tx:hover .sh{opacity:.9}.sn.tx .sb{padding:2px 4px;min-width:30px;font-size:inherit;overflow:visible}#nt{align-items:center;flex-wrap:wrap;max-width:calc(100% - 28px);background:rgba(19,17,31,.92);padding:6px;border:1px solid var(--l);border-radius:12px}#nt label{display:flex;gap:4px;align-items:center;color:var(--m);font-size:12px}
.sh{display:flex;justify-content:space-between;padding:2px 8px;cursor:move;background:#0002}.sh b{cursor:pointer}.sb{flex:1;padding:8px;outline:0;overflow:auto;font-size:14px;white-space:pre-wrap}
#toast{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--a);padding:8px 16px;border-radius:12px;z-index:99}
</style></head>
<body>
<div id="glow"></div><div class="orb" style="width:420px;height:420px;background:#8b5cf6;left:-80px;top:-60px"></div><div class="orb" style="width:360px;height:360px;background:#22d3ee;right:-60px;bottom:-40px;animation-delay:-6s"></div><div class="orb" style="width:300px;height:300px;background:#f472b6;right:30%;top:10%;animation-delay:-11s"></div>

<div id="a" class="screen"><h1 class="logo" style="font-size:12px;letter-spacing:.6em">create · compose · imagine</h1>
<div class="glass"><h1 class="logo">Twilight Studios</h1><input id="u" placeholder="Username" autocomplete="username"><input id="pw" type="text" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc;text-security:disc"><div id="err"></div>
<div class="row"><button id="li" class="pr" style="flex:1">Log in</button><button id="su" style="flex:1">Create account</button></div></div></div>

<div id="b" class="screen hide"><div class="bh"><h1 class="logo">Twilight</h1><nav><button data-t="mine" class="on">Projects</button><button data-t="comm">Community</button><button data-t="inb">Inbox <i id="ib"></i></button></nav><span id="hi"></span><button id="lo">Log out</button></div>
<section id="mine" class="grid"></section><section id="comm" class="grid hide"></section><section id="inb" class="grid hide"></section></div>

<div id="w" class="screen hide"><div id="wc" class="glass"></div></div>

<div id="e" class="screen hide">
<div id="hd"><button id="bk">←</button><b id="pt" class="logo" style="letter-spacing:.15em"></b>
<nav><button data-s="anim" class="on">Animate</button><button data-s="music">Music</button><button data-s="note">Notes</button></nav>
<span id="stat"></span><button id="ly">Layers</button><button id="sett">⚙ Settings</button><button id="sv" class="pr">Save</button></div>
<div id="ptools"></div>
<main><div id="st"><div id="vw"><canvas id="view" width="960" height="540"></canvas><canvas id="ov" width="960" height="540"></canvas></div></div>
<div id="sM" class="hide"><div id="mt"></div><div id="mrow"><div id="mbin"></div><div id="ps"><div id="pi"><canvas id="keys"></canvas><div id="gw"><canvas id="gr"></canvas><div id="prph"></div></div></div></div></div></div>
<div id="sN" class="hide"><div style="position:absolute;z-index:5;left:14px;top:14px;display:flex;gap:4px" id="nt"></div><div id="nb" style="position:absolute;inset:0"><div id="nw"><svg id="nsvg" width="1" height="1"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker></defs><g id="ng"></g></svg></div></div></div></main>
<footer id="tl"><div id="tb"><button id="t0">⏮</button><button id="t1">⏪</button><button id="tp" class="pr">▶</button><button id="t2">⏩</button><button id="t3">⏭</button><span id="tm">0.00s</span><span class="sep"></span><button id="fa">＋ Frame</button><button id="fd">⧉ Duplicate</button><label style="color:var(--m)">Zoom <input id="zm" type="range" min="6" max="80" value="24"></label><button id="lp1">Loop</button></div>
<div id="tw"><div id="ti"><canvas id="tc"></canvas><div id="ph"></div></div></div></footer>
<div id="pop" class="glass hide" style="padding:16px"></div><div id="lp" class="glass hide" style="padding:16px;width:210px"></div></div>
<div id="cm" class="hide"></div><div id="toast" class="hide"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,addDoc,collection,query,where,onSnapshot,updateDoc,deleteDoc,arrayUnion,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCj-nmQEwNtM5O17sJMSq4ywf6TieAvAUY", authDomain: "roentgen-df895.firebaseapp.com", projectId: "roentgen-df895", storageBucket: "roentgen-df895.firebasestorage.app", messagingSenderId: "893786159876", appId: "1:893786159876:web:2ec7c9e6b86af08999ee51", measurementId: "G-K42NV4YEP0" };
const app = initializeApp(firebaseConfig);try{getAnalytics(app)}catch(e){}
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=id=>{$$('.screen').forEach(s=>s.classList.add('hide'));$(id).classList.remove('hide')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),3200)};
const mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'')+'@twilight.studio';
document.addEventListener('mousemove',e=>{document.body.style.setProperty('--mx',e.clientX+'px');document.body.style.setProperty('--my',e.clientY+'px');const b=e.target.closest&&e.target.closest('button');if(b){const r=b.getBoundingClientRect();b.style.setProperty('--x',e.clientX-r.left+'px');b.style.setProperty('--y',e.clientY-r.top+'px')}});
let me=null,pend='';

/* ---------- AUTH ---------- */
async function go(sign){const u=$('#u').value.trim(),p=$('#pw').value;$('#err').textContent='';if(!u||p.length<6){$('#err').textContent='Username and a 6+ character password required';return}
 try{if(sign){pend=u;const c=await createUserWithEmailAndPassword(auth,mail(u),p);await setDoc(doc(db,'users',c.user.uid),{name:u,lname:u.toLowerCase()});updateProfile(c.user,{displayName:u});me.name=u;$('#hi').textContent=u}else await signInWithEmailAndPassword(auth,mail(u),p)}catch(e){$('#err').textContent=(e.code||e.message).replace('auth/','').replace(/-/g,' ')}}
$('#pw').addEventListener('keydown',e=>e.stopPropagation());$('#u').addEventListener('keydown',e=>e.stopPropagation());$('#li').onclick=()=>go(0);$('#su').onclick=()=>go(1);$('#pw').onkeydown=e=>{if(e.key==='Enter')go(0)};
onAuthStateChanged(auth,u=>{if(u){me={uid:u.uid,name:u.displayName||pend||u.email.split('@')[0]};board()}else{me=null;show('#a')}});
$('#lo').onclick=()=>signOut(auth);

/* ---------- BOARD ---------- */
$$('.bh nav button').forEach(b=>b.onclick=()=>{$$('.bh nav button').forEach(x=>x.classList.toggle('on',x===b));['mine','comm','inb'].forEach(i=>$('#'+i).classList.toggle('hide',i!==b.dataset.t))});
const card=(d,own)=>{const p=d.data();return `<div class="card"><h3>${esc(p.title)}</h3><p>${esc((p.memberNames||[]).join(', '))}</p><small>${p.fps} fps · ${p.budget?'budget':'quality'}${p.published?' · published':''}</small><button data-o="${d.id}" data-r="${own?'':1}">${own?'Open':'View'}</button></div>`};
async function board(){show('#b');$('#hi').textContent=me.name;
 const s=await getDocs(query(collection(db,'projects'),where('members','array-contains',me.uid)));
 $('#mine').innerHTML='<div class="card new" id="cr">＋<small>Create</small></div>'+s.docs.map(d=>card(d,1)).join('');$('#cr').onclick=()=>{W_={t:'',c:[],fps:24,bud:false,step:1};show('#w');wz()};
 const c=await getDocs(query(collection(db,'projects'),where('published','==',true)));$('#comm').innerHTML=c.docs.map(d=>card(d,0)).join('')||'<p style="color:var(--m)">Nothing published yet.</p>';
 const i=await getDocs(query(collection(db,'invites'),where('to','==',me.uid)));$('#ib').textContent=i.size?`(${i.size})`:'';
 $('#inb').innerHTML=i.docs.map(d=>{const v=d.data();return `<div class="card"><h3>${esc(v.title)}</h3><p>Invited by ${esc(v.from)}</p><button data-a="${d.id}">Accept</button><button data-x="${d.id}">Decline</button></div>`}).join('')||'<p style="color:var(--m)">Inbox empty.</p>';
 $$('[data-o]').forEach(b=>b.onclick=()=>openP(b.dataset.o,!!b.dataset.r));
 $$('[data-a]').forEach(b=>b.onclick=async()=>{const id=b.dataset.a,v=(await getDoc(doc(db,'invites',id))).data();await updateDoc(doc(db,'projects',v.pid),{members:arrayUnion(me.uid),memberNames:arrayUnion(me.name)});await deleteDoc(doc(db,'invites',id));board()});
 $$('[data-x]').forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,'invites',b.dataset.x));board()})}
async function invite(pid,name,title){const s=await getDocs(query(collection(db,'users'),where('lname','==',name.trim().toLowerCase())));if(s.empty){toast('No user named '+name);return false}
 await setDoc(doc(db,'invites',pid+'_'+s.docs[0].id),{to:s.docs[0].id,from:me.name,pid,title});return true}

/* ---------- ONBOARDING ---------- */
let W_;
function wz(){const el=$('#wc'),s=W_.step;
 if(s==1){el.innerHTML=`<h1 class="logo" style="font-size:20px">New project</h1><input id="wt" placeholder="Project title" value="${esc(W_.t)}"><h3>Collaborators</h3><div class="row"><input id="wn" placeholder="Their username" style="flex:1"><button id="wa">Invite</button></div><div>${W_.c.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div><div class="row"><button id="wx">Cancel</button><button id="wnx" class="pr" style="flex:1">Next</button></div>`;
  $('#wa').onclick=async()=>{const n=$('#wn').value.trim();W_.t=$('#wt').value;if(!n||W_.c.includes(n))return;const s=await getDocs(query(collection(db,'users'),where('lname','==',n.toLowerCase())));if(s.empty)return toast('No user named '+n);W_.c.push(n);wz()};
  $('#wx').onclick=board;$('#wnx').onclick=()=>{W_.t=$('#wt').value.trim()||'Untitled';W_.step=2;wz()}}
 else if(s==2){el.innerHTML=`<h1 class="logo" style="font-size:20px">Frame rate</h1><div class="row">${[8,12,24,30,60].map(f=>`<button data-f="${f}" class="${W_.fps==f?'on':''}">${f}</button>`).join('')}<input id="wf" type="number" min="1" max="120" value="${W_.fps}" style="width:80px"></div><h3>Mode</h3><div class="row"><button id="mq" class="${W_.bud?'':'on'}">Quality · every frame by hand</button><button id="mb" class="${W_.bud?'on':''}">Budget · frames held for 2 ticks</button></div><div class="row"><button id="wb">Back</button><button id="wnx" class="pr" style="flex:1">Create project</button></div>`;
  $$('[data-f]').forEach(b=>b.onclick=()=>{W_.fps=+b.dataset.f;wz()});$('#wf').onchange=e=>{W_.fps=Math.max(1,Math.min(120,+e.target.value||24));wz()};
  $('#mq').onclick=()=>{W_.bud=false;wz()};$('#mb').onclick=()=>{W_.bud=true;wz()};$('#wb').onclick=()=>{W_.step=1;wz()};
  $('#wnx').onclick=async()=>{const r=await addDoc(collection(db,'projects'),{title:W_.t,owner:me.uid,ownerName:me.name,members:[me.uid],memberNames:[me.name],fps:W_.fps,budget:W_.bud,published:false,bpm:120,midi:[],nf:1,notepad:'',updated:serverTimestamp()});for(const c of W_.c)await invite(r.id,c,W_.t);W_.id=r.id;W_.step=3;wz()}}
 else{el.innerHTML=`<h1 class="logo" style="font-size:20px">All set</h1><p>“${esc(W_.t)}” is ready. You can change everything later in Settings.</p><button id="wo" class="pr">Visit project</button>`;$('#wo').onclick=()=>openP(W_.id,false)}}

/* ---------- EDITOR STATE ---------- */
const W=960,H=540,NL=4,LO=21,HI=109,RH=16,KW=72,INS=['Piano','Strings','Atmosphere','Choir','Flute','Guitar'];
let P,ro=false,frames=[],cf=0,cl=0,vis=[1,1,1,1],tool='pen',color='#8b5cf6',size=6,alpha=1,eM='pixel',fillOn=false,Z=1,pan=[0,0],space=false,D=null;
let on={n:2,a:.3,d:.5},undo=[],redo=[],dirty=new Set(),dt,notes=[],clips=[],bpm=120,inst='Piano',snap=.25,lastLen=1,T=0,playing=false,looping=false,T0,t0,srcs=[],A,master,ZOOM=24,drop=-1,unsub,studio='anim',recent=JSON.parse(localStorage.tsRecent||'[]');
let media=[],selC=null,selN=null,muted=new Set(),pv=null;
const b64=ab=>{let s='',u=new Uint8Array(ab);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const newF=()=>({L:Array.from({length:NL},mk)});
const view=$('#view'),ov=$('#ov'),st=$('#st'),vw=$('#vw');
const span=()=>P.budget?2:1,dur=()=>Math.max(frames.length*span()/P.fps,...notes.map(n=>(n.s+n.l)*60/bpm),...clips.map(c=>c.s+c.out-c.in),0);

async function openP(id,r){const d=await getDoc(doc(db,'projects',id));P={id,...d.data()};ro=r||!P.members.includes(me.uid);bpm=P.bpm||120;notes=P.midi||[];media=[];clips=[];selC=null;
 const fs=await getDocs(collection(db,'projects',id,'frames'));frames=[];for(const x of fs.docs.map(v=>v.data()))frames[x.i]=await fromDoc(x);
 for(let i=0;i<Math.max(frames.length,1);i++)frames[i]=frames[i]||newF();cf=0;cl=0;T=0;undo=[];redo=[];dirty.clear();P.nf=frames.length;await loadMedia();

async function addMedia(fl){for(const f of fl){const raw=await f.arrayBuffer();try{media.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:f.name,buf:await actx().decodeAudioData(raw.slice(0)),raw,saved:0})}catch(e){toast("Can't decode "+f.name)}}buildBin()}
function place(m){const c={m,name:m.name,buf:m.buf,mid:m.id,s:T,in:0,out:m.buf.duration,gain:1,fi:0,fo:0};clips.push(c);selC=c;buildBin();drawTL()}
function stopPv(){if(pv){const s=pv.s;pv=null;s.onended=null;try{s.stop()}catch(e){}}}
function buildBin(){const el=$('#mbin');if(!el)return;const c=selC;
 el.innerHTML=`<b>Media</b><button id="ma" class="pr">＋ Add audio (mp3, wav…)</button><input type="file" id="maf" accept="audio/*" multiple class="hide">`+(media.map((m,i)=>`<div class="card" style="padding:10px"><small>${esc(m.name)} · ${m.buf.duration.toFixed(1)}s</small><div class="row"><button data-mp="${i}">${pv&&pv.i===i?'■ Stop':'▶ Preview (5s)'}</button><button data-mt="${i}">To timeline</button><button data-md="${i}">✕</button></div></div>`).join('')||'<small style="color:var(--m)">Add audio files, then put them on the timeline at the playhead.</small>')
 +(c?`<b>Clip: ${esc(c.name)}</b>`+[['Volume','gain',0,2,.05],['Start (s)','s',0,600,.05],['Trim in','in',0,c.m.buf.duration,.05],['Trim out','out',0,c.m.buf.duration,.05],['Fade in','fi',0,20,.1],['Fade out','fo',0,20,.1]].map(r=>`<label style="display:flex;justify-content:space-between;gap:6px"><small>${r[0]}</small><input type="number" data-cp="${r[1]}" min="${r[2]}" max="${r[3]}" step="${r[4]}" value="${(+c[r[1]]).toFixed(2)}" style="width:84px"></label>`).join('')+'<div class="row"><button id="cs">Split at playhead</button><button id="cd">Duplicate</button><button id="cx">Delete</button></div>':'');
 $('#ma').onclick=()=>$('#maf').click();$('#maf').onchange=e=>addMedia(e.target.files);
 $$('[data-mp]').forEach(b=>b.onclick=()=>{const i=+b.dataset.mp,was=pv&&pv.i===i;stopPv();if(!was){const m=media[i],a=actx(),s=a.createBufferSource();s.buffer=m.buf;s.connect(master);s.onended=()=>{if(pv&&pv.s===s){pv=null;buildBin()}};s.start(0,0,Math.min(5,m.buf.duration));pv={s,i}}buildBin()});
 $$('[data-mt]').forEach(b=>b.onclick=()=>place(media[+b.dataset.mt]));
 $$('[data-md]').forEach(b=>b.onclick=()=>{stopPv();const m=media[+b.dataset.md];media=media.filter(x=>x!==m);clips=clips.filter(x=>x.m!==m);if(selC&&selC.m===m)selC=null;for(let k=0;k<(m.n||0);k++)deleteDoc(doc(db,'projects',P.id,'media',m.id+'_'+k)).catch(()=>{});buildBin();drawTL()});
 $$('[data-cp]').forEach(i=>i.onchange=()=>{const k=i.dataset.cp;c[k]=Math.max(+i.min,Math.min(+i.max,+i.value||0));if(c.out<=c.in+.05){if(k==='in')c.in=c.out-.05;else c.out=c.in+.05}buildBin();drawTL()});
 if(c){$('#cs').onclick=()=>clipOp(0);$('#cd').onclick=()=>clipOp(1);$('#cx').onclick=()=>clipOp(2)}}
function clipOp(k){const c=selC;if(!c)return;
 if(k===0){const len=c.out-c.in;if(T>c.s+.02&&T<c.s+len-.02){const t=T-c.s+c.in,n={...c,s:T,in:t,fi:0};c.out=t;c.fo=0;clips.push(n);selC=n}else toast('Put the playhead inside the clip first')}
 else if(k===1){const n={...c,s:c.s+(c.out-c.in)};clips.push(n);selC=n}else{clips=clips.filter(x=>x!==c);selC=null}buildBin();drawTL()}
function cmenu(e,items,fn){const m=$('#cm');m.classList.remove('hide');m.style.left=e.clientX+'px';m.style.top=e.clientY-120+'px';m.innerHTML=items.map(t=>`<div>${t}</div>`).join('');[...m.children].forEach((d,k)=>d.onclick=()=>{m.classList.add('hide');fn(k)})}

/* ---------- NOTEPAD ---------- */
const nb=$('#nb'),nw=$('#nw'),ng=$('#ng');let NP={x:0,y:0,z:1,bg:'#0e0c1a'},nTool='move',nc='#fde68a',ink='#22d3ee',nwid=3,ND=null;
const NC=['#fde68a','#a7f3d0','#bfdbfe','#fbcfe8','#ddd6fe'],NT=[['move','✋ Move'],['note','🗒 Note'],['text','T Text'],['pen','✎ Pen'],['arrow','➜ Arrow'],['paint','🎨 Recolor'],['erase','⌫ Erase']],CUR={move:'grab',note:'copy',text:'text',pen:'crosshair',arrow:'crosshair',paint:'pointer',erase:'pointer'};
$('#nt').innerHTML=NT.map(t=>`<button data-n="${t[0]}" class="${t[0]==='move'?'on':''}">${t[1]}</button>`).join('')+`<span class="sep"></span><label>Ink <input type="color" id="ncol" value="${ink}" style="width:34px;padding:1px"></label><label>Size <input type="range" id="nsz" min="1" max="20" value="${nwid}" style="width:70px"></label><label>Board <input type="color" id="nbgc" value="${NP.bg}" style="width:34px;padding:1px"></label><span class="sep"></span><label>Notes</label>`+NC.map(c=>`<button class="sw" data-nc="${c}" style="background:${c};width:24px;height:24px"></button>`).join('');
$$('[data-n]').forEach(b=>b.onclick=()=>{nTool=b.dataset.n;nb.style.cursor=CUR[nTool];$$('[data-n]').forEach(x=>x.classList.toggle('on',x===b))});$$('[data-nc]').forEach(b=>b.onclick=()=>nc=b.dataset.nc);
$('#ncol').oninput=e=>ink=e.target.value;$('#nsz').oninput=e=>nwid=+e.target.value;$('#nbgc').oninput=e=>setBg(e.target.value);
function setBg(c){NP.bg=c;nb.style.backgroundColor=c;const l=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)),lum=(l[0]*.3+l[1]*.59+l[2]*.11)/255;nb.style.setProperty('--gl',lum<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.12)');const e=$('#nbgc');if(e)e.value=c}
const nxf=()=>{nw.style.transform=`translate(${NP.x}px,${NP.y}px) scale(${NP.z})`;nb.style.backgroundSize=`${40*NP.z}px ${40*NP.z}px`;nb.style.backgroundPosition=`${NP.x}px ${NP.y}px`};
const nwp=e=>{const r=nb.getBoundingClientRect();return[(e.clientX-r.left-NP.x)/NP.z,(e.clientY-r.top-NP.y)/NP.z]};
const NS='http://www.w3.org/2000/svg',svgEl=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
function mark(c){const id='ah'+c.slice(1);if(!ng.querySelector('#'+id)){const m=svgEl('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5,markerHeight:5,orient:'auto'});m.appendChild(svgEl('path',{d:'M0 0L10 5L0 10z',fill:c}));ng.appendChild(m)}return `url(#${id})`}
function addNote(x,y,t='',c=nc){const d=document.createElement('div');d.className='sn';d.style.cssText=`left:${x}px;top:${y}px;background:${c}`;d.dataset.c=c;d.innerHTML='<div class="sh"><span>⋮⋮</span><b>×</b></div><div class="sb" contenteditable>'+esc(t)+'</div>';nw.appendChild(d);return d}
function addText(x,y,t='',col=ink,fs=22){const d=document.createElement('div');d.className='sn tx';d.style.cssText=`left:${x}px;top:${y}px;color:${col};font-size:${fs}px`;d.innerHTML='<div class="sh">⋮⋮</div><div class="sb" contenteditable>'+esc(t)+'</div>';nw.appendChild(d);return d}
function recolor(el){if(el.classList&&el.classList.contains('sn')){if(el.classList.contains('tx'))el.style.color=ink;else{el.style.background=nc;el.dataset.c=nc}}else{el.setAttribute('stroke',ink);if(el.tagName==='line')el.setAttribute('marker-end',mark(ink))}}
nb.onwheel=e=>{e.preventDefault();const r=nb.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,z=Math.min(3,Math.max(.2,NP.z*(e.deltaY<0?1.1:.9)));NP.x=mx-(mx-NP.x)*z/NP.z;NP.y=my-(my-NP.y)*z/NP.z;NP.z=z;nxf()};
nb.onpointerdown=e=>{const t=e.target,p=nwp(e),sn=t.closest('.sn'),sh=t.closest('.sh'),sv=t.closest('#ng *');
 if(sh&&!t.matches('b')&&nTool!=='erase'&&nTool!=='paint'){ND={k:'n',n:sn,p,x0:parseFloat(sn.style.left),y0:parseFloat(sn.style.top)};nb.setPointerCapture(e.pointerId);return}
 if(t.matches('.sh b')){sn.remove();return}
 if(nTool==='erase'){if(sn){sn.remove();return}if(sv)sv.remove();ND={k:'er'};nb.setPointerCapture(e.pointerId);return}
 if(nTool==='paint'){if(sn||sv)recolor(sn||sv);return}
 if(sn)return;
 if(nTool==='note'){const d=addNote(p[0],p[1]);setTimeout(()=>d.querySelector('.sb').focus(),0);return}
 if(nTool==='text'){const d=addText(p[0],p[1],'',ink,12+nwid*2);setTimeout(()=>d.querySelector('.sb').focus(),0);return}
 nb.setPointerCapture(e.pointerId);
 if(nTool==='pen'){const el=svgEl('path',{d:`M${p[0]} ${p[1]}`,stroke:ink,'stroke-width':nwid,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});ng.appendChild(el);ND={k:'p',el}}
 else if(nTool==='arrow'){const el=svgEl('line',{x1:p[0],y1:p[1],x2:p[0],y2:p[1],stroke:ink,'stroke-width':nwid,'stroke-linecap':'round','marker-end':mark(ink)});ng.appendChild(el);ND={k:'a',el}}
 else ND={k:'pan',x:e.clientX-NP.x,y:e.clientY-NP.y}};
nb.onpointermove=e=>{if(!ND)return;if(ND.k==='pan'){NP.x=e.clientX-ND.x;NP.y=e.clientY-ND.y;nxf();return}const p=nwp(e);
 if(ND.k==='n'){ND.n.style.left=ND.x0+p[0]-ND.p[0]+'px';ND.n.style.top=ND.y0+p[1]-ND.p[1]+'px'}
 else if(ND.k==='p')ND.el.setAttribute('d',ND.el.getAttribute('d')+` L${p[0]} ${p[1]}`);
 else if(ND.k==='er'){const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.closest('#ng *'))el.closest('#ng *').remove()}
 else{ND.el.setAttribute('x2',p[0]);ND.el.setAttribute('y2',p[1])}};
nb.onpointerup=()=>ND=null;
nb.ondblclick=e=>{if(e.target===nb||e.target===nw){const p=nwp(e);addNote(p[0],p[1])}};
nb.addEventListener('focusout',e=>{const d=e.target.closest&&e.target.closest('.sn.tx');if(d&&!d.innerText.trim())d.remove()});
const serNotes=()=>JSON.stringify({n:[...nw.querySelectorAll('.sn')].map(d=>({x:parseFloat(d.style.left),y:parseFloat(d.style.top),c:d.dataset.c,tx:d.classList.contains('tx'),col:d.style.color,fs:parseFloat(d.style.fontSize)||0,w:d.style.width,h:d.style.height,t:d.querySelector('.sb').innerText})),s:ng.innerHTML,bg:NP.bg});
function loadNotes(j){nw.querySelectorAll('.sn').forEach(n=>n.remove());ng.innerHTML='';NP={x:0,y:0,z:1,bg:'#0e0c1a'};nxf();setBg(NP.bg);try{const o=JSON.parse(j);o.n.forEach(n=>{if(n.tx)addText(n.x,n.y,n.t,n.col||ink,n.fs||22);else{const d=addNote(n.x,n.y,n.t,n.c);if(n.w)d.style.width=n.w;if(n.h)d.style.height=n.h}});ng.innerHTML=o.s;if(o.bg)setBg(o.bg)}catch(e){}}
addEventListener('resize',()=>P&&drawTL());
</script>
</body></html>
